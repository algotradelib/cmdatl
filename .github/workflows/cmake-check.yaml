# Builds cmdatl against the installed algotradelib and atlc that the organization's actions pull, and runs the whole suite, the real-atlc acceptance cases included (a skipped one fails the job).
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'tools/**'
      - 'driver/**'
      - 'examples/**'
      - '.github/scripts/**'
      - '.github/workflows/cmake-check.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'tools/**'
      - 'driver/**'
      - 'examples/**'
      - '.github/scripts/**'
      - '.github/workflows/cmake-check.yaml'

name: cmake-check

jobs:
  cmake:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest}
          - {os: macos-latest}

    name: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - id: atl
        uses: algotradelib/.github/actions/setup-atl@main

      - id: atlc
        uses: algotradelib/.github/actions/setup-atlc@main

      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # DuckDB's prebuilt C library, for the replay's store loader (test-replay-store) and the store backtests.
      - name: DuckDB
        shell: bash
        run: |
          case "$RUNNER_OS" in Linux) z=libduckdb-linux-amd64.zip ;; macOS) z=libduckdb-osx-universal.zip ;; esac
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" "https://github.com/duckdb/duckdb/releases/download/v1.5.6/$z"
          (cd "$RUNNER_TEMP/duckdb" && cmake -E tar xf ../duckdb.zip)
          echo "CMDATL_TEST_DUCKDB=$RUNNER_TEMP/duckdb" >> "$GITHUB_ENV"

      - uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          options: |
            CMDATL_FETCH_DEPS=ON
            "CMAKE_PREFIX_PATH=${{ steps.atl.outputs.path }}"

      - uses: threeal/ctest-action@v1.1.0
        env:
          CMDATL_TEST_ATLC: ${{ steps.atlc.outputs.atlc }}
          CMDATL_TEST_PREFIX: ${{ steps.atl.outputs.path }}
        with:
          test-dir: build
          args: -E ^test-acceptance$

      # ctest passes test-acceptance when only some of its cases skip; the script fails on any skipped case.
      - name: Acceptance
        env:
          CMDATL_TEST_ATLC: ${{ steps.atlc.outputs.atlc }}
          CMDATL_TEST_PREFIX: ${{ steps.atl.outputs.path }}
        run: .github/scripts/acceptance.sh build/test-cli "$RUNNER_TEMP/acceptance.xml"
