# Line and branch coverage of cmdatl's headers and sources on Linux (GCC, gcovr), the real-atlc acceptance cases included.
# Codecov gets the report.
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'tools/**'
      - 'driver/**'
      - '.github/scripts/**'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'tools/**'
      - 'driver/**'
      - '.github/scripts/**'
      - '.github/workflows/test-coverage.yaml'

name: test-coverage

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - id: atl
        uses: algotradelib/.github/actions/setup-atl@main

      - id: atlc
        uses: algotradelib/.github/actions/setup-atlc@main

      # atlc's examples, for the acceptance cases.
      - uses: actions/checkout@v7
        with:
          repository: algotradelib/atlc
          path: atlc-src

      - name: gcovr
        run: pipx install gcovr

      - uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          cxx-flags: --coverage
          options: |
            CMAKE_BUILD_TYPE=Debug
            CMAKE_CXX_FLAGS_DEBUG=-g0
            CMDATL_FETCH_DEPS=ON
            "CMAKE_PREFIX_PATH=${{ steps.atl.outputs.path }}"

      - uses: threeal/ctest-action@v1.1.0
        env:
          CMDATL_TEST_ATLC: ${{ steps.atlc.outputs.atlc }}
          CMDATL_TEST_PREFIX: ${{ steps.atl.outputs.path }}
          CMDATL_TEST_ATLC_EXAMPLES: ${{ github.workspace }}/atlc-src/examples
        with:
          test-dir: build
          args: -E ^test-acceptance$

      - name: Acceptance
        env:
          CMDATL_TEST_ATLC: ${{ steps.atlc.outputs.atlc }}
          CMDATL_TEST_PREFIX: ${{ steps.atl.outputs.path }}
          CMDATL_TEST_ATLC_EXAMPLES: ${{ github.workspace }}/atlc-src/examples
        run: .github/scripts/acceptance.sh build/test-cli "$RUNNER_TEMP/acceptance.xml"

      - name: Coverage
        run: gcovr --root . --filter 'include/cmdatl/' --filter 'src/' --merge-lines --xml coverage.xml build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          # A fork has no Codecov token, so a failed upload fails only this repository's runs.
          fail_ci_if_error: ${{ !github.event.repository.fork }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
