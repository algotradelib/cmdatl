# Every symbol of the file; EEE misses a bar each month, which the program's missing = skip leaves out.
strategy = "universe.atls"

[data]
source = "csv"
file = "data/daily.csv"          # synthetic daily bars written for these examples
symbol_column = "symbol"
time = "date"
time_format = "iso"
open_point = true                 # each day as a point at its open, then the day's bar at its close

[replay]
market = "us"                     # on_open and on_close follow this market's session
cash = 1000000
fill_header = "decision-close.hpp" # at the price a handler saw: the open in on_open, the close in on_close
fill_function = "decision_close"
