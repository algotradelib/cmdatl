# The example mock account, over the examples' synthetic daily bars; the operator's file, read through CMDATL_CONFIG:
#   export CMDATL_CONFIG=$PWD/examples/mock.toml
#   touch examples/mock.armed # the operator arms the account; without this file nothing may be placed

[account]
broker = "mock"
number = "example" # names the account's state directory

[limits]
symbols = ["AAA", "BBB"]
position = { AAA = 100, BBB = 100 }
order_value = 20000 # KRW, one order
daily_orders = 10 # placements per KST date
collar = 0.05

[mock]
bars = "data/daily.csv"
cash = 1000000
start = "2024-01-03T09:30" # KST: the second date's session, with the first date's close as the previous close
